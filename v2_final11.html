<script>
(function(){
"use strict";
const measure=document.getElementById("measure");
const sameBtn=document.getElementById("sameBtn");
const randomBtn=document.getElementById("randomBtn");
let randomMode=false;
const newBtn=document.getElementById("new");
const startBtn=document.getElementById("start");
const stopBtn=document.getElementById("stop");
const bpm=document.getElementById("bpm");
const bpmValue=document.getElementById("bpmValue");
const status=document.getElementById("status");
const previewWrap=document.getElementById("previewWrap");
const previewMeasure=document.getElementById("previewMeasure");
const nextRowWrap=document.getElementById("nextRowWrap");
const nextMeasure=document.getElementById("nextMeasure");

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const TYPES=["q","e","s","t","x","r8","r16","re","er","tr"];
const WEIGHTS=[14,18,16,12,8,6,5,5,5,4];
let current=null,nextPattern=null,timer=null,running=false,audio=null,beatTimers=[],activeRow=0;
function weightedType(){let total=WEIGHTS.reduce((a,b)=>a+b,0),r=Math.random()*total;for(let i=0;i<TYPES.length;i++){r-=WEIGHTS[i];if(r<0)return TYPES[i]}return TYPES[0]}
function unitsForType(type){
  if(type==='q') return [{d:1}];
  if(type==='e') return [{d:.5},{d:.5}];
  if(type==='s') return [{d:.25},{d:.25},{d:.25},{d:.25}];
  if(type==='t') return [{d:1/3},{d:1/3},{d:1/3,triplet:true}];
  if(type==='x') return Array.from({length:6},()=>({d:1/6,sext:true}));
  if(type==='r8') return [{d:.5,rest:true},{d:.5,rest:true}];
  if(type==='r16') return Array.from({length:4},()=>({d:.25,rest:true}));
  if(type==='re') return [{d:.5,rest:true},{d:.5}];
  if(type==='er') return [{d:.5},{d:.5,rest:true}];
  if(type==='tr') return [{d:1/3},{d:1/3},{d:1/3,rest:true,triplet:true}];
  return [{d:1}];
}
function mixedUnits(){
  const r=Math.random();
  if(r<.34) return [{d:.5},{d:.25},{d:.25}];
  if(r<.67) return [{d:.25},{d:.5},{d:.25}];
  return [{d:.25},{d:.25},{d:.5}];
}
function countHits(type){return unitsForType(type).filter(u=>!u.rest).length}
function makePattern(){
  const p=[];
  for(let i=0;i<4;i++){
    let type=weightedType();
    let units=unitsForType(type);
    // 같은 박 안에서도 8분+16분처럼 서로 다른 분할이 섞일 수 있게 한다.
    if(Math.random()<.34 && i<3){type='mix';units=mixedUnits();}
    p.push({type,units,accents:[]});
  }
  p.forEach(b=>{
    const n=b.units.filter(u=>!u.rest).length;
    if(n>0){
      const k=Math.floor(Math.random()*(n+1));
      b.accents=shuffle(Array.from({length:n},(_,i)=>i)).slice(0,k).sort((a,b)=>a-b);
    }
  });
  return p;
}
function key(p){return JSON.stringify(p)}
function makeDifferent(exclude){let p;do{p=makePattern()}while(key(p)===exclude);return p}
current=makePattern();nextPattern=makeDifferent(key(current));
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function note(x,accent=false){return `<ellipse class="note" cx="${x-4}" cy="94" rx="14" ry="8" transform="rotate(-18 ${x-4} 94)"/><line class="stem" x1="${x+9}" y1="92" x2="${x+9}" y2="45"/>${accent?`<text class="accent" x="${x+9}" y="15" text-anchor="middle">&gt;</text>`:""}`}
function rest(type,x=90){
  // 명확한 악보형 쉼표를 SVG로 직접 그린다.
  if(type==='r8'){
    return `<g aria-label="8분쉼표">
      <path class="rest" d="M90 24 C86 34 96 39 96 48 C96 57 88 61 88 69 C88 77 94 82 102 84"/>
      <path class="rest" d="M96 48 C106 46 114 40 114 34 C114 29 110 26 105 27 C101 27 98 29 96 33"/>
    </g>`;
  }
  if(type==='r16'){
    return `<g aria-label="16분쉼표">
      <path class="rest" d="M82 24 C78 34 88 39 88 48 C88 57 80 61 80 69 C80 77 86 82 94 84"/>
      <path class="rest" d="M88 48 C98 46 106 40 106 34 C106 29 102 26 97 27 C93 27 90 29 88 33"/>
      <path class="rest" d="M106 45 C102 55 112 60 112 68 C112 76 104 80 104 87 C104 93 109 96 115 97"/>
      <path class="rest" d="M112 68 C121 66 128 61 128 56 C128 52 125 49 121 49 C117 49 114 51 112 54"/>
    </g>`;
  }
  // 4분쉼표: 표준적인 지그재그 형태
  return `<g aria-label="4분쉼표">
    <path class="rest" d="M76 26 C91 29 101 34 94 43 C88 51 77 53 84 62 C90 70 104 72 96 83 C91 90 87 96 91 103"/>
    <path class="rest" d="M94 43 L103 49"/>
  </g>`;
}
function drawUnits(units,accents=[]){
  const playable=units.map((u,i)=>({...u,i}));
  const positions=[]; let cursor=28;
  playable.forEach((u)=>{positions.push({x:cursor,w:u.d*124,u});cursor+=u.d*124;});
  let body='';
  positions.forEach((o,idx)=>{
    const x=o.x+o.w/2;
    if(o.u.rest){body+=rest(o.u.d<=.25?'r16':'r8',x);return;}
    const acc=accents.includes(idx);
    body+=noteAt(x,acc);
  });
  // 빔은 인접한 8/16분음표를 실제 분할대로 묶는다.
  for(let i=0;i<positions.length-1;i++){
    const a=positions[i],b=positions[i+1];
    if(a.u.rest||b.u.rest||a.u.d>0.5||b.u.d>0.5) continue;
    const y1=48, y2=58;
    body+=`<line class="beam" x1="${a.x+a.w/2+8}" y1="${y1}" x2="${b.x+b.w/2+8}" y2="${y1}"/>`;
    if(a.u.d<=.25 && b.u.d<=.25) body+=`<line class="beam" x1="${a.x+a.w/2+8}" y1="${y2}" x2="${b.x+b.w/2+8}" y2="${y2}"/>`;
  }
  if(units.every(u=>u.d===1/3 || u.triplet) && units.length===3) body+=`<line class="rest" x1="30" y1="28" x2="58" y2="28" stroke-width="3"/><line class="rest" x1="122" y1="28" x2="150" y2="28" stroke-width="3"/><text class="label" x="90" y="34" text-anchor="middle">3</text>`;
  if(units.every(u=>u.d===1/6 || u.sext) && units.length===6) body+=`<line class="rest" x1="18" y1="28" x2="42" y2="28" stroke-width="3"/><line class="rest" x1="138" y1="28" x2="162" y2="28" stroke-width="3"/><text class="label" x="90" y="34" text-anchor="middle">6</text>`;
  return body;
}
function noteAt(x,accent=false){return `<ellipse class="note" cx="${x-4}" cy="94" rx="14" ry="8" transform="rotate(-18 ${x-4} 94)"/><line class="stem" x1="${x+9}" y1="92" x2="${x+9}" y2="45"/>${accent?`<text class="accent" x="${x+9}" y="15" text-anchor="middle">&gt;</text>`:""}`}
function rest(type,x=90){
  const sx=x-34;
  if(type==='r8') return `<g aria-label="8분쉼표"><path class="rest" d="M${sx+34} 30 L${sx+34} 70 C${sx+34} 79 ${sx+29} 86 ${sx+21} 88 C${sx+30} 88 ${sx+41} 84 ${sx+41} 73 L${sx+41} 50 C${sx+48} 48 ${sx+53} 44 ${sx+53} 38 C${sx+53} 33 ${sx+49} 30 ${sx+44} 30 C${sx+40} 30 ${sx+37} 32 ${sx+34} 35"/><circle class="restDot" cx="${sx+42}" cy="33" r="3.5"/></g>`;
  return `<g aria-label="16분쉼표"><path class="rest" d="M${sx+28} 30 L${sx+28} 70 C${sx+28} 79 ${sx+23} 86 ${sx+15} 88 C${sx+24} 88 ${sx+35} 84 ${sx+35} 73 L${sx+35} 50 C${sx+42} 48 ${sx+47} 44 ${sx+47} 38 C${sx+47} 33 ${sx+43} 30 ${sx+38} 30 C${sx+34} 30 ${sx+31} 32 ${sx+28} 35"/><path class="rest" d="M${sx+48} 46 L${sx+48} 78 C${sx+48} 85 ${sx+44} 90 ${sx+38} 92 C${sx+45} 92 ${sx+54} 88 ${sx+54} 80 L${sx+54} 61 C${sx+61} 59 ${sx+66} 55 ${sx+66} 50 C${sx+66} 46 ${sx+63} 43 ${sx+59} 43 C${sx+55} 43 ${sx+52} 44 ${sx+48} 46"/></g>`;
}
function beatData(b){return b.units || unitsForType(b.type)}
function beat(b){return `<svg viewBox="0 0 180 130" aria-label="박">${drawUnits(beatData(b),b.accents||[])}</svg>`}
function render(p,target=measure){target.innerHTML=p.map(b=>`<div class="beat">${beat(b)}</div>`).join("")}
function renderPreview(p){previewMeasure.innerHTML=p.map(b=>`<div class="beat">${beat(b)}</div>`).join("")}
function renderNext(p){nextMeasure.innerHTML=p.map(b=>`<div class="beat">${beat(b)}</div>`).join("")}
function refreshPreview(){previewWrap.style.display="none";nextRowWrap.style.display=randomMode?"block":"none";if(randomMode)renderNext(nextPattern)}
render(current);renderNext(nextPattern);refreshPreview();
bpm.addEventListener("input",()=>bpmValue.textContent=bpm.value);
newBtn.addEventListener("click",()=>{
  stop();
  activeRow=0;
  current=makePattern();
  nextPattern=makeDifferent(key(current));
  render(current,measure);
  renderNext(nextPattern);
  refreshPreview();
});
function setMode(random){randomMode=random;sameBtn.classList.toggle("active",!random);randomBtn.classList.toggle("active",random);if(random){nextPattern=makeDifferent(key(current));renderNext(nextPattern)}refreshPreview()}
sameBtn.addEventListener("click",()=>{stop();setMode(false)});randomBtn.addEventListener("click",()=>{stop();setMode(true)});
function hit(t,strong){
  if(!audio || audio.state!=="running")return;
  const ctx=audio;

  // 더 선명한 드럼 타격: 짧은 저음 몸통 + 고역 어택 노이즈.
  const osc=ctx.createOscillator();
  const gain=ctx.createGain();
  osc.type="triangle";
  osc.frequency.setValueAtTime(strong?150:115,t);
  osc.frequency.exponentialRampToValueAtTime(strong?62:58,t+0.075);
  gain.gain.setValueAtTime(0.0001,t);
  gain.gain.exponentialRampToValueAtTime(strong?0.34:0.23,t+0.002);
  gain.gain.exponentialRampToValueAtTime(0.0001,t+0.11);
  osc.connect(gain);gain.connect(ctx.destination);
  osc.start(t);osc.stop(t+0.13);

  const buffer=ctx.createBuffer(1,Math.floor(ctx.sampleRate*0.035),ctx.sampleRate);
  const data=buffer.getChannelData(0);
  for(let i=0;i<data.length;i++){
    const env=1-i/data.length;
    data[i]=(Math.random()*2-1)*env;
  }
  const noise=ctx.createBufferSource();
  const hp=ctx.createBiquadFilter();
  const ng=ctx.createGain();
  noise.buffer=buffer;
  hp.type="highpass";
  hp.frequency.setValueAtTime(strong?900:1200,t);
  hp.Q.value=0.7;
  ng.gain.setValueAtTime(0.0001,t);
  ng.gain.exponentialRampToValueAtTime(strong?0.34:0.22,t+0.001);
  ng.gain.exponentialRampToValueAtTime(0.0001,t+0.035);
  noise.connect(hp);hp.connect(ng);ng.connect(ctx.destination);
  noise.start(t);noise.stop(t+0.04);
}
function play(p){
  const sec=60/Number(bpm.value);
  const now=audio.currentTime+0.03;
  p.forEach((b,i)=>{
    let t=now+i*sec;
    let units=beatData(b), ai=0;
    units.forEach(u=>{
      if(!u.rest) hit(t,(b.accents||[]).includes(ai));
      if(!u.rest) ai++;
      t+=sec*u.d;
    });
  });
}
function clearBeatTimers(){beatTimers.forEach(clearTimeout);beatTimers=[];}
function setActiveBeat(i){
 const cells=measure.querySelectorAll('.beat');
 cells.forEach((el,n)=>{el.classList.remove('active');if(n===i)el.classList.add('active');});
}
function setActiveRowBeat(i){
  clearBeatTimers();
  const target=activeRow===0?measure:nextMeasure;
  const other=activeRow===0?nextMeasure:measure;
  target.querySelectorAll('.beat').forEach((el,n)=>{el.classList.toggle('active',n===i);});
  other.querySelectorAll('.beat').forEach(el=>el.classList.remove('active'));
}
function animateBeats(){
  clearBeatTimers();
  const sec=60000/Number(bpm.value);
  let i=0;
  const step=()=>{
    if(!running)return;
    setActiveRowBeat(i);
    i++;
    if(i<4) beatTimers.push(setTimeout(step,sec));
  };
  step();
}
function schedule(){
 if(!running)return;
 play(current);
 animateBeats();
 const ms=(60/Number(bpm.value))*4000;
 timer=setTimeout(()=>{
   if(!running)return;
   clearBeatTimers();
   if(randomMode){
     // 두 줄의 위치는 고정하고, 위/아래 줄이 번갈아 현재 진행 줄이 된다.
     activeRow=activeRow===0?1:0;
     current=nextPattern;
     nextPattern=makeDifferent(key(current));
     if(activeRow===0){
       render(current,measure);
       renderNext(nextPattern);
     }else{
       render(current,nextMeasure);
       render(nextPattern,measure);
     }
   }
   schedule();
 },Math.max(100,ms-35));
}

startBtn.addEventListener("click",async()=>{
 if(running)return;
 const AC=window.AudioContext||window.webkitAudioContext;
 if(!AC){status.textContent="오디오 지원 안 됨";return;}
 if(!audio)audio=new AC();
 try{
   if(audio.state==="suspended")await audio.resume();
   if(audio.state!=="running"){status.textContent="오디오 준비 중";return;}
   hit(audio.currentTime+0.01,true);
 }catch(e){console.error(e);status.textContent="오디오 준비 중";return;}
 if(randomMode){
   if(key(nextPattern)===key(current))nextPattern=makeDifferent(key(current));
   if(activeRow===0) renderNext(nextPattern);
   else render(nextPattern,measure);
 }
 running=true;status.textContent="GO!";schedule();
});
stopBtn.addEventListener("click",stop);
function stop(){
  running=false;
  clearTimeout(timer);timer=null;clearBeatTimers();
  measure.querySelectorAll(".beat,.beat").forEach(el=>el.classList.remove("active"));
  nextMeasure.querySelectorAll(".beat").forEach(el=>el.classList.remove("active"));
  status.textContent="READY";
}
})();
</script>
</body>
</html>
