<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>드럼 강약 연습기</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:#101010;color:#f7f7f7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:auto}
.app{width:min(94vw,900px);min-height:100svh;height:auto;margin:auto;padding:clamp(10px,2vh,22px) 0;display:flex;flex-direction:column;gap:clamp(6px,1.2vh,12px)}
h1{text-align:center;margin:0;font-size:clamp(27px,4vw,52px);line-height:1.05;letter-spacing:-.05em}
.sub{text-align:center;margin:3px 0 0;color:#aaa;font-size:clamp(13px,1.7vw,22px)}
.panel{background:#1d1d1d;border-radius:24px;padding:clamp(10px,1.7vh,20px) clamp(18px,3vw,35px)}
.bpm-title{text-align:center;font-size:clamp(24px,3vw,36px);font-weight:800}
input[type=range]{width:100%;height:26px;accent-color:#4285f4}
.bpm{width:min(270px,45%);height:clamp(50px,7vh,68px);margin:2px auto 8px;border:4px solid #5b5b5b;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:clamp(28px,3.2vw,42px)}
.modes{display:flex;justify-content:center;gap:clamp(18px,4vw,60px);font-size:clamp(15px,1.9vw,23px)}
.mode{display:flex;align-items:center;gap:8px}
.mode input{appearance:none;width:25px;height:25px;border-radius:50%;background:#fff;border:3px solid #aaa;margin:0}
.mode input:checked{border:8px solid #4d8df5}
#status{text-align:center;font-size:clamp(58px,8vw,96px);font-weight:900;line-height:.9;margin:clamp(3px,1vh,10px) 0}
.grid{display:block;flex:0 0 auto}
.measure{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(8px,1.5vw,14px)}
.beat-group{height:clamp(120px,16vh,165px);background:#252525;border:4px solid #343434;border-radius:22px;padding:8px 7px;display:flex;flex-direction:column;justify-content:space-between;align-items:center}
.beat-group.active{border-color:#555}
.beat-num{font-size:clamp(36px,4.8vw,62px);font-weight:900;line-height:1}
.slots{width:100%;display:grid;grid-template-columns:repeat(4,1fr);text-align:center;align-items:center;gap:2px}
.note{font-size:clamp(30px,3.6vw,48px);font-weight:900;color:#70c5ff;line-height:1}
.strong{color:#ff7474}
.note.hit{transform:scale(1.25)}
.controls{display:flex;justify-content:center;gap:10px}
button{border:0;border-radius:18px;padding:11px 22px;background:#303030;color:#fff;font-size:clamp(16px,1.9vw,23px);font-weight:800}
.primary{background:#fff;color:#111}
.help{text-align:center;color:#888;font-size:clamp(11px,1.3vw,16px);margin:0}
@media(max-height:760px){
 .app{gap:5px;padding-top:6px}
 .panel{padding:7px 18px}
 .beat-group{height:92px;padding:6px 5px}
 #status{font-size:clamp(48px,7vw,75px)}
}



 .preview-wrap{display:none}
body:has(#random:checked) #previewWrap{display:block!important}
body:has(#repeat:checked) #previewWrap{display:none!important}
.preview-wrap.is-hidden{display:none!important}
.preview-wrap{margin:clamp(8px,1.5vh,14px) auto 0;text-align:center;max-width:900px}
.preview-title{font-size:clamp(13px,1.8vw,18px);color:#888;margin-bottom:5px}
.preview-measure{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(8px,1.5vw,14px)}
.preview-card{height:clamp(72px,9vh,92px);background:#1b1b1b;border:3px solid #2d2d2d;border-radius:16px;padding:7px 10px;display:flex;flex-direction:column;justify-content:space-between;box-sizing:border-box}
.preview-num{font-size:clamp(22px,3vw,32px);font-weight:900;line-height:1}
.preview-slots{display:grid;grid-template-columns:repeat(4,1fr);align-items:center;gap:2px;font-size:clamp(19px,2.8vw,28px);font-weight:900;line-height:1}
.preview-slots .strong{color:#ff7474}
.preview-slots span:not(.strong){color:#70c5ff}
</style>
</head>
<body>
<main class="app">
<h1>🥁 드럼 강약 연습기</h1>
<p class="sub">1 · 2 · 3 · 4 박자에 맞춰 강 / 약을 반복합니다.</p>

<section class="panel">
<div class="bpm-title">BPM</div>
<input id="bpm" type="range" min="40" max="180" value="80">
<div class="bpm" id="bpmValue">80</div>
<div class="modes">
<label class="mode"><input type="radio" name="mode" id="repeat" checked onchange="setMode('repeat')">같은 패턴 반복</label>
<label class="mode"><input type="radio" name="mode" id="random" onchange="setMode('random')">매 마디 랜덤</label>
</div>
</section>

<div id="status">READY</div>
<section class="grid" id="grid">
<div class="measure">
  <div class="beat-group" id="group0"><div class="beat-num">1</div><div class="slots" id="slots0">
      <span class="note strong" id="n0_0">&lt;</span>
      <span class="note" id="n0_1">_</span>
      <span class="note" id="n0_2">_</span>
      <span class="note" id="n0_3">_</span>
    </div></div>
  <div class="beat-group" id="group1"><div class="beat-num">2</div><div class="slots" id="slots1">
      <span class="note strong" id="n1_0">&lt;</span>
      <span class="note" id="n1_1">_</span>
      <span class="note" id="n1_2">_</span>
      <span class="note" id="n1_3">_</span>
    </div></div>
  <div class="beat-group" id="group2"><div class="beat-num">3</div><div class="slots" id="slots2">
      <span class="note strong" id="n2_0">&lt;</span>
      <span class="note" id="n2_1">_</span>
      <span class="note" id="n2_2">_</span>
      <span class="note" id="n2_3">_</span>
    </div></div>
  <div class="beat-group" id="group3"><div class="beat-num">4</div><div class="slots" id="slots3">
      <span class="note strong" id="n3_0">&lt;</span>
      <span class="note" id="n3_1">_</span>
      <span class="note" id="n3_2">_</span>
      <span class="note" id="n3_3">_</span>
    </div></div>
</div>
</section>

<div class="preview-wrap" id="previewWrap">
  <div class="preview-title">다음 패턴 미리보기</div>
  <div class="preview-measure">
    <div class="preview-card">
      <div class="preview-num">1</div>
      <div class="preview-slots" id="preview0"><span class="strong">&lt;</span><span>_</span><span>_</span><span>_</span></div>
    </div>
    <div class="preview-card">
      <div class="preview-num">2</div>
      <div class="preview-slots" id="preview1"><span class="strong">&lt;</span><span>_</span><span>_</span><span>_</span></div>
    </div>
  </div>
</div>

<div class="controls">
<button class="primary" id="start">▶ 시작</button>
<button id="stop">■ 정지</button>
<button id="new">↻ 새 패턴</button>
</div>
<p class="help">한 마디는 4박, 각 박은 16분음표 4칸입니다. &lt; = 강 · _ = 약</p>
</main>

<script>
const bpm=document.getElementById('bpm');
const bpmValue=document.getElementById('bpmValue');
const statusEl=document.getElementById('status');

let patterns=[
  ['<','_','_','_'],
  ['<','_','_','_'],
  ['<','_','_','_'],
  ['<','_','_','_']
];

let nextPatterns=[
  ['<','_','_','_'],
  ['<','_','_','_'],
  ['<','_','_','_'],
  ['<','_','_','_']
];

let audioCtx=null;
let running=false;
let timer=null;
let beat=0;
let measure=0;
let nextNoteTime=0;
let sessionId=0;

// Rolling view: top row = current pair, bottom row = next pair.


function setMode(mode){
  const repeat=document.getElementById('repeat');
  const random=document.getElementById('random');
  if(mode==='random'){
    repeat.checked=false;
    random.checked=true;
    nextPatterns=[
      randomPattern(),randomPattern(),randomPattern(),randomPattern()
    ];
  }else{
    repeat.checked=true;
    random.checked=false;
  }
  renderPreview();
}

function renderPreview(){
  const a=document.getElementById('preview0');
  const b=document.getElementById('preview1');
  if(!a || !b)return;

  const draw=(el,pat)=>{
    el.innerHTML='';
    (pat || ['<','_','_','_']).forEach(x=>{
      const s=document.createElement('span');
      s.className=(x==='<')?'strong':'';
      s.textContent=x;
      el.appendChild(s);
    });
  };
  draw(a,nextPatterns[0]);
  draw(b,nextPatterns[1]);
}

function render(){
  renderPreview();
  patterns.forEach((p,i)=>{
    const slots=document.getElementById('slots'+i);
    if(!slots)return;
    slots.replaceChildren();
    p.forEach((x,j)=>{
      const n=document.createElement('span');
      n.className='note'+(x==='<'?' strong':'');
      n.id='n'+i+'_'+j;
      n.textContent=x;
      slots.appendChild(n);
    });
  });
}
function randomPattern(){
  const p=Array.from({length:4},()=>Math.random()<.5?'<':'_');
  p[0]='<';
  return p;
}

function clearHits(){
  document.querySelectorAll('.beat-group').forEach(c=>c.classList.remove('active'));
  document.querySelectorAll('.note').forEach(n=>n.classList.remove('hit'));
}

function newPattern(){
  patterns=[
    randomPattern(),randomPattern(),randomPattern(),randomPattern()
  ];
  nextPatterns=[
    randomPattern(),randomPattern(),randomPattern(),randomPattern()
  ];
  render();
  clearHits();
  stop();
}

function drumSound(time,strong){
  if(!audioCtx)return;

  // Crisp metronome/drum click. Both strong AND weak beats are audible;
  // strong gets a higher pitch and a little more level.
  const osc=audioCtx.createOscillator();
  const gain=audioCtx.createGain();
  const filter=audioCtx.createBiquadFilter();

  osc.type='square';
  osc.frequency.setValueAtTime(strong?1250:900,time);

  filter.type='highpass';
  filter.frequency.setValueAtTime(500,time);

  gain.gain.setValueAtTime(0.0001,time);
  gain.gain.exponentialRampToValueAtTime(strong?0.34:0.24,time+0.002);
  gain.gain.exponentialRampToValueAtTime(0.0001,time+0.055);

  osc.connect(filter);
  filter.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(time);
  osc.stop(time+0.06);

  // Short low body makes it feel like a drum hit rather than a pure beep.
  const body=audioCtx.createOscillator();
  const bodyGain=audioCtx.createGain();
  body.type='sine';
  body.frequency.setValueAtTime(strong?180:145,time);
  body.frequency.exponentialRampToValueAtTime(75,time+0.045);
  bodyGain.gain.setValueAtTime(0.0001,time);
  bodyGain.gain.exponentialRampToValueAtTime(strong?0.18:0.12,time+0.002);
  bodyGain.gain.exponentialRampToValueAtTime(0.0001,time+0.07);
  body.connect(bodyGain);
  bodyGain.connect(audioCtx.destination);
  body.start(time);
  body.stop(time+0.075);
}

function showBeat(m,b,delay){
  window.setTimeout(()=>{
    if(!running)return;
    clearHits();
    const card=document.getElementById('group'+m);
    const note=document.getElementById('n'+m+'_'+b);
    if(card)card.classList.add('active');
    if(note)note.classList.add('hit');
  },Math.max(0,delay));
}

function scheduler(){
  if(!audioCtx || !running)return;

  while(nextNoteTime < audioCtx.currentTime + 0.15){
    const group=measure%4;
    const p=patterns[group];
    const slot=beat;
    const strong=p[slot]==='<';

    drumSound(nextNoteTime,strong);
    showBeat(group,slot,(nextNoteTime-audioCtx.currentTime)*1000);

    // BPM is the quarter-note pulse. Four 16th notes fit inside it.
    nextNoteTime += (60 / Number(bpm.value)) / 4;
    beat++;

    if(beat>=4){
      beat=0;
      measure++;

      // Keep 1-4 fixed on screen. When the 4-measure cycle ends,
      // replace all four patterns at once and prepare another preview.
      if(measure%4===0 && document.getElementById('random').checked){
        patterns = nextPatterns.slice();
        nextPatterns=[
          randomPattern(),randomPattern(),randomPattern(),randomPattern()
        ];
        render();
        clearHits();
      }
    }
  }
}

async function start(){
  if(running)return;

  if(timer){
    window.clearInterval(timer);
    timer=null;
  }

  if(!audioCtx){
    audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  }

  if(audioCtx.state==='suspended'){
    await audioCtx.resume();
  }

  running=true;
  sessionId++;
  beat=0;
  measure=0;

  if(document.getElementById('random').checked){
    nextPatterns=[
      randomPattern(),randomPattern(),randomPattern(),randomPattern()
    ];
    renderPreview();
  }

  statusEl.textContent='GO!';
  clearHits();

  // Always start from the current AudioContext clock.
  nextNoteTime=audioCtx.currentTime+0.08;
  scheduler();
  timer=window.setInterval(scheduler,20);
}

function stop(){
  running=false;
  sessionId++;

  if(timer){
    window.clearInterval(timer);
    timer=null;
  }

  statusEl.textContent='READY';
  clearHits();
}

bpm.addEventListener('input',()=>bpmValue.textContent=bpm.value);
document.getElementById('start').addEventListener('click',start);
document.getElementById('stop').addEventListener('click',stop);
document.getElementById('new').addEventListener('click',newPattern);

document.addEventListener('visibilitychange',()=>{
  if(document.hidden)stop();
});

// Start in the original, no-preview mode.
document.getElementById('repeat').checked=true;
document.getElementById('random').checked=false;


render();
statusEl.textContent='READY';
</script>
</body>
</html>
