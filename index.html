<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>드럼 리듬 연습기</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#111;color:#fff;margin:0;padding:18px;text-align:center}
.wrap{max-width:820px;margin:auto}
h1{margin:6px 0 8px}
.sub{color:#aaa;margin-bottom:18px;line-height:1.5}
.panel{background:#1d1d1d;border-radius:18px;padding:18px;margin-bottom:16px}
.row{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;margin:10px 0}
.row label{color:#ddd}
select,input[type=number]{font-size:16px;padding:9px;background:#2b2b2b;color:#fff;border:1px solid #555;border-radius:8px}
input[type=range]{width:min(420px,75vw)}
.section-title{font-weight:bold;margin:14px 0 7px;color:#ddd}
.help{font-size:13px;color:#888;margin-top:6px}
.beats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:18px 0}
.beat{background:#252525;border:2px solid #333;border-radius:14px;padding:14px 7px;min-height:100px;transition:.08s}
.beat.active{transform:scale(1.04);border-color:#fff;background:#3a3a3a}
.pos{font-size:12px;color:#888}
.note{font-size:25px;font-weight:bold;margin-top:5px}
.accent{font-size:17px;margin-top:5px}
.rest{color:#888}
.strong{color:#ff6b6b}
.weak{color:#66c7ff}
.triplet{color:#c9a7ff}
#current{font-size:32px;font-weight:bold;min-height:42px;margin:12px}
button{font-size:17px;padding:12px 18px;border:0;border-radius:10px;margin:4px;cursor:pointer}
.primary{background:#fff;color:#111;font-weight:bold}.secondary{background:#333;color:#fff}
.status{color:#aaa;font-size:14px;min-height:20px}
@media(max-width:600px){.beats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="wrap">
<h1>🥁 드럼 리듬 연습기</h1>
<div class="sub">4/4 한 마디를 기준으로 강·약, 쉼표, 싱코페이션, 3연음을 연습합니다.</div>

<div class="panel">
  <div class="row">
    <strong>BPM</strong>
    <input id="bpmRange" type="range" min="40" max="220" value="80">
    <input id="bpmNumber" type="number" min="40" max="220" value="80">
  </div>

  <div class="section-title">리듬 패턴</div>
  <div class="row">
    <select id="patternType">
      <option value="quarter">4분음표 4개</option>
      <option value="eighth">8분음표 8개</option>
      <option value="sixteenth">16분음표 16개</option>
      <option value="quarterEighth">4분 + 8분 조합</option>
      <option value="mixed16">4분 + 8분 + 16분 조합</option>
      <option value="rests">쉼표 포함</option>
      <option value="syncopation">싱코페이션</option>
      <option value="eighthTriplet">8분 3연음 12개</option>
      <option value="quarterTriplet">4분 3연음 6개</option>
      <option value="tripletMixed">3연음 + 쉼표</option>
      <option value="random">전체 랜덤</option>
    </select>
  </div>

  <div class="section-title">강약</div>
  <div class="row">
    <select id="accentMode">
      <option value="accented">강박은 강, 나머지는 약</option>
      <option value="random">강/약 랜덤</option>
      <option value="strongOnly">전부 강</option>
      <option value="weakOnly">전부 약</option>
      <option value="offbeat">엇박을 강하게</option>
  </div>

  <div class="section-title">연습 방식</div>
  <div class="row">
    <select id="repeatMode">
      <option value="fixed">같은 패턴 반복</option>
      <option value="randomBar">매 마디 새 패턴</option>
    </select>
  </div>
  <div class="help">패턴을 바꾸면 '새 패턴'을 눌러 즉시 확인할 수 있습니다.</div>
</div>

<div id="current">READY</div>
<div id="beats" class="beats"></div>
<div class="status" id="status"></div>

<button id="startBtn" class="primary">▶ 시작</button>
<button id="stopBtn" class="secondary">■ 정지</button>
<button id="newBtn" class="secondary">↻ 새 패턴</button>

<script>
const bpmRange = document.getElementById('bpmRange');
const bpmNumber = document.getElementById('bpmNumber');
const patternType = document.getElementById('patternType');
const accentMode = document.getElementById('accentMode');
const repeatMode = document.getElementById('repeatMode');
const beatsEl = document.getElementById('beats');
const currentEl = document.getElementById('current');
const statusEl = document.getElementById('status');

let pattern = [];
let eventIndex = 0;
let timer = null;
let running = false;
let audioCtx = null;

const noteNames = {
  1: '4분음표',
  0.5: '8분음표',
  0.25: '16분음표',
  2/3: '4분 3연음',
  1/3: '8분 3연음'
};

function rand(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

function makeEvents(durations, kind='straight'){
  return durations.map(d => ({dur:d, kind, rest:false, accent:null}));
}

/* 정확히 4/4가 되는 기본 패턴들 */
const libraries = {
  quarter: () => makeEvents([1,1,1,1]),
  eighth: () => makeEvents(Array(8).fill(.5)),
  sixteenth: () => makeEvents(Array(16).fill(.25)),

  quarterEighth: () => rand([
    [1,.5,.5,1,1],
    [.5,.5,1,.5,.5,1],
    [1,.5,.5,.5,.5,1],
    [.5,.5,.5,.5,1,1],
    [1,1,.5,.5,.5,.5]
  ]).map(d=>({dur:d,kind:'straight',rest:false,accent:null})),

  mixed16: () => rand([
    [1,.5,.5,.25,.25,.25,.25,1],
    [1,.5,.25,.25,.5,1,.25,.25],
    [.5,.5,1,.25,.25,.5,.5],
    [1,.25,.25,.5,.5,.5,.5],
    [.25,.25,.5,1,.5,.5,.5]
  ]).map(d=>({dur:d,kind:'straight',rest:false,accent:null})),

  rests: () => {
    const bases = [
      [1,.5,.5,1,1],
      [.5,.5,1,.5,.5,1],
      [.25,.25,.5,.5,1,.5,.5],
      [.5,.25,.25,.5,.5,.5,.5]
    ];
    const p = rand(bases).map(d=>({dur:d,kind:'straight',rest:false,accent:null}));
    // 음표를 쉼표로 바꾸되, 최소 2개는 소리가 나게 함
    let restCount = 0;
    p.forEach(e=>{
      if(Math.random()<.28 && restCount<2){ e.rest=true; restCount++; }
    });
    if(p.every(e=>e.rest)) p[rand(p)].rest=false;
    return p;
  },

  syncopation: () => {
    const sync = [
      [1,.5,.5,1,1],
      [.5,.5,1,.5,.5,1],
      [.5,.25,.25,.5,1,1],
      [.25,.25,.5,1,.5,.5,1],
      [.5,.5,.5,.5,1,1]
    ];
    const p = rand(sync).map(d=>({dur:d,kind:'straight',rest:false,accent:null}));
    // 일부 엇박 위치를 쉼표로 만들어 싱코페이션 느낌 강화
    if(Math.random()<.65){
      const candidates = p.map((e,i)=>({e,i})).filter(x=>x.i>0 && x.e.dur<=.5);
      if(candidates.length){
        const x=rand(candidates); x.e.rest=true;
      }
    }
    return p;
  },

  eighthTriplet: () => makeEvents(Array(12).fill(1/3),'triplet'),
  quarterTriplet: () => makeEvents(Array(6).fill(2/3),'triplet'),

  tripletMixed: () => {
    const p = makeEvents(Array(12).fill(1/3),'triplet');
    // 3연음 중 일부를 쉼표 처리
    [1,4,7,10].forEach(i=>{ if(Math.random()<.6) p[i].rest=true; });
    return p;
  }
};

function generateRandomPattern(){
  const choices = ['quarter','eighth','sixteenth','quarterEighth','mixed16','rests','syncopation','eighthTriplet','quarterTriplet','tripletMixed'];
  return libraries[rand(choices)]();
}

function getBasePattern(){
  const type = patternType.value;
  if(type === 'random') return generateRandomPattern();
  return libraries[type]();
}

function applyAccents(p){
  const mode = accentMode.value;
  let elapsed = 0;

  p.forEach((e)=>{
    if(e.rest){ e.accent=null; elapsed += e.dur; return; }

    const pos16 = Math.round(elapsed * 4) % 16;
    const isBeat = [0,4,8,12].includes(pos16);
    const isOffbeat = [2,6,10,14].includes(pos16);

    if(mode === 'strongOnly') e.accent='strong';
    else if(mode === 'weakOnly') e.accent='weak';
    else if(mode === 'random') e.accent = Math.random()<.5 ? 'strong' : 'weak';
    else if(mode === 'offbeat') e.accent = isOffbeat ? 'strong' : 'weak';
    else e.accent = isBeat ? 'strong' : 'weak';

    elapsed += e.dur;
  });
  return p;
}

function newPattern(){
  pattern = applyAccents(getBasePattern());
  eventIndex = 0;
  render();
}

function eventLabel(e){
  if(e.rest) return '쉼표';
  if(e.kind==='triplet') return e.dur > .5 ? '4분 3연음' : '8분 3연음';
  return noteNames[e.dur] || '리듬';
}

function render(){
  beatsEl.innerHTML='';
  pattern.forEach((e,i)=>{
    const d=document.createElement('div');
    d.className='beat' + (e.kind==='triplet'?' triplet':'') + (e.rest?' rest':'');
    d.id='beat'+i;
    d.innerHTML =
      '<div class="pos">'+(i+1)+'</div>'+
      '<div class="note">'+eventLabel(e)+'</div>'+
      '<div class="accent '+(e.accent||'')+'">'+
        (e.rest?'쉼표':e.accent==='strong'?'강':'약')+
      '</div>';
    beatsEl.appendChild(d);
  });
  const total = pattern.reduce((s,e)=>s+e.dur,0);
  statusEl.textContent = `한 마디 길이: ${total.toFixed(2)}박 · ${pattern.length}개 이벤트`;
}

function clickSound(accent, triplet=false){
  if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended') audioCtx.resume();

  const osc=audioCtx.createOscillator();
  const gain=audioCtx.createGain();
  osc.type='square';
  osc.frequency.value = accent==='strong' ? 1250 : 700;
  const volume = accent==='strong' ? .82 : .25;
  gain.gain.setValueAtTime(volume,audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.055);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(); osc.stop(audioCtx.currentTime+.065);
}

function quarterMs(){ return 60000 / Number(bpmNumber.value); }

function clearTimer(){
  if(timer){ clearTimeout(timer); timer=null; }
}

function playNext(){
  if(!running) return;

  document.querySelectorAll('.beat').forEach(x=>x.classList.remove('active'));
  const e=pattern[eventIndex];
  const el=document.getElementById('beat'+eventIndex);
  if(el) el.classList.add('active');

  currentEl.textContent = e.rest ? '쉼표' : `${e.accent==='strong'?'강':'약'} · ${eventLabel(e)}`;

  if(!e.rest) clickSound(e.accent,e.kind==='triplet');

  const delay=e.dur*quarterMs();
  eventIndex++;

  if(eventIndex>=pattern.length){
    eventIndex=0;
    if(repeatMode.value==='randomBar'){
      pattern=applyAccents(getBasePattern());
      render();
    }
  }
  timer=setTimeout(playNext,Math.max(10,delay));
}

function start(){
  stop(false);
  running=true;
  eventIndex=0;
  playNext();
}

function stop(reset=true){
  running=false;
  clearTimer();
  if(reset){
    document.querySelectorAll('.beat').forEach(x=>x.classList.remove('active'));
    currentEl.textContent='READY';
  }
}

function syncBpm(v){
  v=Math.max(40,Math.min(220,Number(v)||80));
  bpmRange.value=v; bpmNumber.value=v;
}

bpmRange.addEventListener('input',e=>syncBpm(e.target.value));
bpmNumber.addEventListener('change',e=>syncBpm(e.target.value));
patternType.addEventListener('change',newPattern);
accentMode.addEventListener('change',newPattern);
repeatMode.addEventListener('change',()=>{});
document.getElementById('startBtn').addEventListener('click',start);
document.getElementById('stopBtn').addEventListener('click',()=>stop(true));
document.getElementById('newBtn').addEventListener('click',()=>{stop(true);newPattern();});

newPattern();
</script>
</body>
</html>
