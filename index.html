<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>드럼 강약 연습기</title>
<style>
*{box-sizing:border-box}
html{background:#111}
body{
  margin:0;
  min-height:100%;
  background:#111;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  overflow-x:hidden;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
}
.wrap{
  width:min(96vw,760px);
  margin:0 auto;
  padding:clamp(22px,4vh,42px) 0 calc(42px + env(safe-area-inset-bottom));
}
h1{
  margin:0;
  text-align:center;
  font-size:clamp(30px,5.8vw,58px);
  line-height:1.05;
  font-weight:800;
  letter-spacing:-.04em;
}
.sub{
  margin:18px 0 28px;
  text-align:center;
  color:#aaa;
  font-size:clamp(16px,3.2vw,30px);
}
.panel{
  background:#1d1d1d;
  border-radius:28px;
  padding:30px 24px 26px;
}
.bpm-title{
  text-align:center;
  font-size:clamp(25px,4.8vw,42px);
  font-weight:800;
  margin-bottom:16px;
}
input[type=range]{
  display:block;width:88%;margin:0 auto 22px;
  accent-color:#4d8df7;
}
.bpm-number{
  width:210px;max-width:70%;margin:0 auto 22px;
  padding:14px 10px;
  border:4px solid #555;border-radius:20px;
  background:#2b2b2b;text-align:center;
  font-size:clamp(28px,5vw,42px);
}
.modes{
  display:flex;justify-content:center;gap:42px;flex-wrap:wrap;
  font-size:clamp(17px,3.2vw,29px);
}
.mode{display:flex;align-items:center;gap:12px;cursor:pointer}
.mode input{appearance:none;width:38px;height:38px;border-radius:50%;background:#fff;border:2px solid #aaa;margin:0}
.mode input:checked{background:#4d8df7;border-color:#4d8df7;box-shadow:inset 0 0 0 10px #4d8df7}
.mode input:checked:after{content:"";display:block;width:10px;height:10px;margin:12px auto;background:#fff;border-radius:50%}
.ready{
  text-align:center;font-size:clamp(56px,10vw,92px);
  font-weight:900;margin:34px 0 26px;
}
.grid{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
  gap:14px;margin-bottom:24px;
}
.card{
  height:180px;
  min-height:0;background:#242424;border:5px solid #333;border-radius:26px;
  padding:28px 18px 20px;display:flex;flex-direction:column;
  justify-content:space-between;align-items:center;
}
.card-num{font-size:clamp(44px,7vw,66px);font-weight:800}
.beats{width:100%;display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.beat{
  min-width:0;text-align:center;font-size:clamp(28px,5vw,44px);
  font-weight:800;line-height:1;color:#70bdf0;
}
.beat.strong{color:#ff7373}
.buttons{
  display:flex;justify-content:center;gap:16px;flex-wrap:wrap;
  padding-bottom:12px;
}
button{
  border:0;border-radius:18px;padding:18px 28px;
  font-size:clamp(20px,3.6vw,30px);font-weight:800;
  background:#333;color:#fff;cursor:pointer;
  touch-action:manipulation;
}
button.primary{background:#fff;color:#111}
button:disabled{opacity:.45}
.note{text-align:center;color:#777;font-size:14px;margin-top:10px}
@media(max-width:520px){
  .wrap{padding-top:26px}
  .panel{padding:24px 16px 22px;border-radius:24px}
  .grid{gap:12px}
  .card{height:165px;min-height:0;border-radius:22px;padding:22px 12px 18px}
  .modes{gap:18px}
  .mode input{width:32px;height:32px}
  .mode input:checked:after{margin:9px auto}
}
@media(max-width:390px){
  .card{height:155px;min-height:0}
  button{padding:15px 20px}
}
</style>

<style>
@media (max-width:520px){
  .wrap{
    width:94vw;
    padding:14px 0 calc(12px + env(safe-area-inset-bottom));
  }
  h1{
    font-size:clamp(28px,7.4vw,36px);
    line-height:1;
  }
  .sub{
    margin:8px 0 12px;
    font-size:15px;
    line-height:1.2;
  }
  .panel{
    padding:15px 14px 13px;
    border-radius:20px;
  }
  .bpm-title{
    font-size:25px;
    margin-bottom:8px;
  }
  input[type=range]{
    width:90%;
    margin:0 auto 10px;
  }
  .bpm-number{
    width:145px;
    max-width:48%;
    padding:7px 8px;
    margin:0 auto 10px;
    border-width:3px;
    border-radius:14px;
    font-size:28px;
  }
  .modes{
    gap:18px;
    font-size:15px;
    flex-wrap:nowrap;
  }
  .mode{
    gap:7px;
    white-space:nowrap;
  }
  .mode input{
    width:25px;
    height:25px;
    flex:none;
  }
  .mode input:checked:after{
    width:7px;height:7px;margin:7px auto;
  }
  .ready{
    font-size:58px;
    line-height:1;
    margin:18px 0 14px;
  }
  .grid{
    gap:8px;
    margin-bottom:12px;
  }
  .card{
    height:118px;
    min-height:0;
    border-width:4px;
    border-radius:18px;
    padding:10px 9px 9px;
  }
  .card-num{
    font-size:42px;
    line-height:1;
  }
  .beats{
    gap:5px;
  }
  .beat{
    font-size:27px;
    line-height:1;
  }
  .buttons{
    gap:8px;
    padding-bottom:0;
    flex-wrap:nowrap;
  }
  button{
    padding:10px 14px;
    border-radius:13px;
    font-size:17px;
    white-space:nowrap;
  }
  .note{
    margin-top:7px;
    font-size:11px;
    line-height:1.2;
  }
}
</style>

</head>
<body>
<main class="wrap">
  <h1>🥁 드럼 강약 연습기</h1>
  <div class="sub">1 · 2 · 3 · 4 박자에 맞춰 강 / 약을 반복합니다.</div>

  <section class="panel">
    <div class="bpm-title">BPM</div>
    <input id="bpm" type="range" min="40" max="180" value="110">
    <div id="bpmNumber" class="bpm-number">110</div>
    <div class="modes">
      <label class="mode"><input type="radio" name="mode" value="repeat" checked>같은 패턴 반복</label>
      <label class="mode"><input type="radio" name="mode" value="random">매 마디 랜덤</label>
    </div>
  </section>

  <div id="status" class="ready">READY</div>

  <section id="grid" class="grid">
  <div class="card"><div class="card-num">1</div><div class="beats"><div class="beat strong">&lt;</div><div class="beat">_</div><div class="beat">_</div><div class="beat">_</div></div></div>
  <div class="card"><div class="card-num">2</div><div class="beats"><div class="beat strong">&lt;</div><div class="beat">_</div><div class="beat">_</div><div class="beat">_</div></div></div>
  <div class="card"><div class="card-num">3</div><div class="beats"><div class="beat strong">&lt;</div><div class="beat">_</div><div class="beat">_</div><div class="beat">_</div></div></div>
  <div class="card"><div class="card-num">4</div><div class="beats"><div class="beat strong">&lt;</div><div class="beat">_</div><div class="beat">_</div><div class="beat">_</div></div></div>
</section>

  <div class="buttons">
    <button id="start" class="primary">▶ 시작</button>
    <button id="stop">■ 정지</button>
    <button id="new">↻ 새 패턴</button>
  </div>
  <div class="note">각 박자는 4분음표 4칸으로 표시됩니다. &lt; = 강 · _ = 약</div>
</main>

<script>
const bpmEl=document.getElementById('bpm');
const bpmNumber=document.getElementById('bpmNumber');
const grid=document.getElementById('grid');
const statusEl=document.getElementById('status');
const startBtn=document.getElementById('start');
const stopBtn=document.getElementById('stop');
const newBtn=document.getElementById('new');

let pattern=[];
let timer=null;
let running=false;
let step=0;
let audioCtx=null;

function makePattern(){
  pattern=Array.from({length:4},()=>Array.from({length:4},(_,i)=>i===0));
  for(let bar=0;bar<4;bar++){
    for(let i=0;i<4;i++){
      if(Math.random()<0.35) pattern[bar][i]=true;
    }
    pattern[bar][0]=true;
  }
  render();
}
function render(activeBar=-1,activeBeat=-1){
  grid.innerHTML='';
  pattern.forEach((bar,b)=>{
    const card=document.createElement('div');
    card.className='card';
    const num=document.createElement('div');
    num.className='card-num'; num.textContent=b+1;
    const beats=document.createElement('div'); beats.className='beats';
    bar.forEach((strong,i)=>{
      const x=document.createElement('div');
      x.className='beat'+(strong?' strong':'');
      x.textContent=strong?'&lt;':'_';
      x.innerHTML=strong?'&lt;':'_';
      if(b===activeBar && i===activeBeat){
        x.style.transform='scale(1.22)';
        x.style.filter='brightness(1.35)';
      }
      beats.appendChild(x);
    });
    card.append(num,beats); grid.appendChild(card);
  });
}
function ensureAudio(){
  if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended') audioCtx.resume();
}
function clickSound(strong){
  ensureAudio();
  const o=audioCtx.createOscillator(), g=audioCtx.createGain();
  o.type='sine';
  o.frequency.value=strong?180:120;
  g.gain.setValueAtTime(0.0001,audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(strong?0.22:0.12,audioCtx.currentTime+0.005);
  g.gain.exponentialRampToValueAtTime(0.0001,audioCtx.currentTime+0.09);
  o.connect(g).connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+0.1);
}
function tick(){
  const bar=Math.floor(step/4)%4, beat=step%4;
  render(bar,beat);
  clickSound(pattern[bar][beat]);
  step++;
}
function start(){
  if(running)return;
  ensureAudio();
  running=true; step=0; statusEl.textContent='PLAY';
  const ms=60000/Number(bpmEl.value);
  tick(); timer=setInterval(tick,ms);
}
function stop(){
  running=false; clearInterval(timer); timer=null; statusEl.textContent='READY'; render();
}
function newPattern(){
  if(running) stop();
  makePattern();
}
bpmEl.addEventListener('input',()=>{
  bpmNumber.textContent=bpmEl.value;
  if(running){stop();start();}
});
startBtn.addEventListener('click',start);
stopBtn.addEventListener('click',stop);
newBtn.addEventListener('click',newPattern);

makePattern();
</script>
</body>
</html>
