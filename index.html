<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>드럼 강약 연습기</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:#101010;color:#f7f7f7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:auto}
.app{width:94vw;max-width:900px;min-height:100svh;height:auto;margin:auto;padding:clamp(10px,2vh,22px) 0;display:flex;flex-direction:column;gap:clamp(6px,1.2vh,12px)}
h1{text-align:center;margin:0;font-size:clamp(27px,4vw,52px);line-height:1.05;letter-spacing:-.05em}
.sub{text-align:center;margin:3px 0 0;color:#aaa;font-size:clamp(13px,1.7vw,22px)}
.panel{background:#1d1d1d;border-radius:24px;padding:clamp(10px,1.7vh,20px) clamp(18px,3vw,35px)}
.bpm-title{text-align:center;font-size:clamp(24px,3vw,36px);font-weight:800}
input[type=range]{width:100%;height:26px;accent-color:#4285f4}
.bpm{width:min(270px,45%);height:clamp(50px,7vh,68px);margin:2px auto 8px;border:4px solid #5b5b5b;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:clamp(28px,3.2vw,42px)}
.modes{display:flex;justify-content:center;gap:clamp(18px,4vw,60px);font-size:clamp(15px,1.9vw,23px)}
.mode{display:flex;align-items:center;gap:8px}
.mode input{appearance:none;width:25px;height:25px;border-radius:50%;background:#fff;border:3px solid #aaa;margin:0}
.mode input:checked{border:8px solid #4d8df5}
#status{text-align:center;font-size:clamp(58px,8vw,96px);font-weight:900;line-height:.9;margin:clamp(3px,1vh,10px) 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:clamp(7px,1.2vw,14px);flex:0 0 auto}
.card{height:clamp(96px,12.5vh,138px);background:#252525;border:4px solid #343434;border-radius:22px;padding:8px 16px;display:flex;flex-direction:column;justify-content:space-between;align-items:center}
.num{font-size:clamp(36px,4.8vw,62px);font-weight:900;line-height:1}
.pattern{width:100%;display:grid;grid-template-columns:repeat(4,1fr);text-align:center}
.note{font-size:clamp(27px,3.5vw,48px);font-weight:900;color:#70c5ff;line-height:1}
.strong{color:#ff7474}
.card.active{border-color:#555}
.note.hit{transform:scale(1.25)}
.controls{display:flex;justify-content:center;gap:10px}
button{border:0;border-radius:18px;padding:11px 22px;background:#303030;color:#fff;font-size:clamp(16px,1.9vw,23px);font-weight:800}
.primary{background:#fff;color:#111}
.help{text-align:center;color:#888;font-size:clamp(11px,1.3vw,16px);margin:0}
@media(max-height:760px){
 .app{gap:5px;padding-top:6px}
 .panel{padding:7px 18px}
 .card{height:96px;padding:6px 14px}
 #status{font-size:clamp(48px,7vw,75px)}
}
</style>
</head>
<body>
<main class="app">
<h1>🥁 드럼 강약 연습기</h1>
<p class="sub">1 · 2 · 3 · 4 박자에 맞춰 강 / 약을 반복합니다.</p>

<section class="panel">
<div class="bpm-title">BPM</div>
<input id="bpm" type="range" min="40" max="180" value="110">
<div class="bpm" id="bpmValue">110</div>
<div class="modes">
<label class="mode"><input type="radio" name="mode" id="repeat" checked>같은 패턴 반복</label>
<label class="mode"><input type="radio" name="mode" id="random">매 마디 랜덤</label>
</div>
</section>

<div id="status">READY</div>
<section class="grid" id="grid">
<div class="card" id="card0"><div class="num">1</div><div class="pattern"><span class="note strong" id="n0_0">&lt;</span><span class="note" id="n0_1">_</span><span class="note" id="n0_2">_</span><span class="note" id="n0_3">_</span></div></div>
<div class="card" id="card1"><div class="num">2</div><div class="pattern"><span class="note strong" id="n1_0">&lt;</span><span class="note" id="n1_1">_</span><span class="note" id="n1_2">_</span><span class="note strong" id="n1_3">&lt;</span></div></div>
<div class="card" id="card2"><div class="num">3</div><div class="pattern"><span class="note strong" id="n2_0">&lt;</span><span class="note strong" id="n2_1">&lt;</span><span class="note" id="n2_2">_</span><span class="note" id="n2_3">_</span></div></div>
<div class="card" id="card3"><div class="num">4</div><div class="pattern"><span class="note strong" id="n3_0">&lt;</span><span class="note strong" id="n3_1">&lt;</span><span class="note" id="n3_2">_</span><span class="note strong" id="n3_3">&lt;</span></div></div>
</section>

<div class="controls">
<button class="primary" id="start">▶ 시작</button>
<button id="stop">■ 정지</button>
<button id="new">↻ 새 패턴</button>
</div>
<p class="help">각 박자는 4분음표 4칸으로 표시됩니다. &lt; = 강 · _ = 약</p>
</main>

<script>
const bpm=document.getElementById('bpm');
const bpmValue=document.getElementById('bpmValue');
const statusEl=document.getElementById('status');

let patterns=[
 ['<','_','_','_'],
 ['<','_','_','<'],
 ['<','<','_','_'],
 ['<','<','_','<']
];

let audioCtx=null;
let running=false;
let timer=null;
let beat=0;
let measure=0;
let nextNoteTime=0;

function render(){
  patterns.forEach((p,i)=>{
    p.forEach((x,j)=>{
      const n=document.getElementById('n'+i+'_'+j);
      if(n){
        n.textContent=x;
        n.classList.toggle('strong',x==='<');
      }
    });
  });
}

function randomPattern(){
  const p=Array.from({length:4},()=>Math.random()<.5?'<':'_');
  // Always keep the first beat accented so a random bar has a clear pulse.
  p[0]='<';
  return p;
}

function clearHits(){
  document.querySelectorAll('.card').forEach(c=>c.classList.remove('active'));
  document.querySelectorAll('.note').forEach(n=>n.classList.remove('hit'));
}

function newPattern(){
  patterns=[
    randomPattern(),randomPattern(),randomPattern(),randomPattern()
  ];
  render();
  clearHits();
  stop();
}

function drumSound(time,strong){
  if(!audioCtx)return;

  // Short synthesized drum-like click/thump; no external audio files needed.
  const osc=audioCtx.createOscillator();
  const gain=audioCtx.createGain();

  osc.type='triangle';
  osc.frequency.setValueAtTime(strong?150:105,time);
  osc.frequency.exponentialRampToValueAtTime(strong?62:58,time+0.10);

  gain.gain.setValueAtTime(0.0001,time);
  gain.gain.exponentialRampToValueAtTime(strong?0.9:0.55,time+0.006);
  gain.gain.exponentialRampToValueAtTime(0.0001,time+0.16);

  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(time);
  osc.stop(time+0.17);

  // Tiny noise burst for a more drum-like attack.
  const buffer=audioCtx.createBuffer(1,audioCtx.sampleRate*0.045,audioCtx.sampleRate);
  const data=buffer.getChannelData(0);
  for(let i=0;i<data.length;i++) data[i]=(Math.random()*2-1)*Math.exp(-i/data.length*7);

  const noise=audioCtx.createBufferSource();
  const ng=audioCtx.createGain();
  noise.buffer=buffer;
  ng.gain.setValueAtTime(strong?0.12:0.07,time);
  ng.gain.exponentialRampToValueAtTime(0.0001,time+0.045);
  noise.connect(ng);
  ng.connect(audioCtx.destination);
  noise.start(time);
}

function showBeat(m,b,delay){
  window.setTimeout(()=>{
    if(!running)return;
    clearHits();
    const card=document.getElementById('card'+m);
    const note=document.getElementById('n'+m+'_'+b);
    if(card)card.classList.add('active');
    if(note)note.classList.add('hit');
  },Math.max(0,delay));
}

function scheduler(){
  if(!audioCtx)return;

  // Schedule about 120 ms ahead using AudioContext time, so timing stays stable
  // even if Safari repaints the page.
  while(nextNoteTime < audioCtx.currentTime + 0.12){
    const m=measure%4;
    const p=patterns[m];
    const b=beat;
    const strong=p[b]==='<';

    drumSound(nextNoteTime,strong);
    showBeat(m,b,(nextNoteTime-audioCtx.currentTime)*1000);

    nextNoteTime += 60 / Number(bpm.value);
    beat++;

    if(beat>=4){
      beat=0;
      measure++;
      if(document.getElementById('random').checked){
        patterns[measure%4]=randomPattern();
        render();
      }
    }
  }
}

async function start(){
  if(running)return;

  if(!audioCtx){
    audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  }

  if(audioCtx.state==='suspended'){
    await audioCtx.resume();
  }

  running=true;
  beat=0;
  measure=0;
  statusEl.textContent='GO!';
  clearHits();

  nextNoteTime=audioCtx.currentTime+0.05;
  scheduler();
  timer=window.setInterval(scheduler,25);
}

function stop(){
  running=false;
  if(timer){
    window.clearInterval(timer);
    timer=null;
  }
  statusEl.textContent='READY';
  clearHits();
}

bpm.addEventListener('input',()=>bpmValue.textContent=bpm.value);
document.getElementById('start').addEventListener('click',start);
document.getElementById('stop').addEventListener('click',stop);
document.getElementById('new').addEventListener('click',newPattern);

document.addEventListener('visibilitychange',()=>{
  if(document.hidden)stop();
});

render();
statusEl.textContent='READY';
</script>
</body>
</html>
