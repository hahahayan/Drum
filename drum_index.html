<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>드럼 강약 연습기</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:#111}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#fff;text-align:center;padding:clamp(8px,1.5vh,16px);overflow:hidden}
.wrap{width:min(96vw,760px);height:calc(100vh - clamp(16px,3vh,32px));margin:auto;display:flex;flex-direction:column;justify-content:space-between}
h1{font-size:clamp(25px,4.8vh,42px);line-height:1.05;margin:0;font-weight:800}
.sub{font-size:clamp(12px,2.4vh,20px);color:#aaa;margin:0}
.panel{background:#1d1d1d;border-radius:clamp(12px,2vh,20px);padding:clamp(8px,1.8vh,16px) 18px;margin:0}
.bpm-title{font-size:clamp(18px,3.4vh,28px);font-weight:800;margin-bottom:clamp(4px,1vh,9px)}
.bpm{display:flex;flex-direction:column;gap:clamp(5px,1vh,9px);align-items:center}
input[type=range]{width:88%;height:clamp(16px,2.4vh,24px);accent-color:#4b8df8}
input[type=number]{width:clamp(100px,22vw,170px);font-size:clamp(17px,2.8vh,24px);text-align:center;padding:clamp(4px,0.8vh,8px);background:#2b2b2b;color:#fff;border:2px solid #555;border-radius:clamp(8px,1.5vh,12px)}
.mode{display:flex;justify-content:center;gap:clamp(14px,3vw,28px);flex-wrap:wrap;margin-top:0;font-size:clamp(13px,2.4vh,19px)}
.mode label{display:flex;align-items:center;gap:5px}
.mode input{width:clamp(17px,2.5vh,23px);height:clamp(17px,2.5vh,23px);accent-color:#4b8df8}
#current{font-size:clamp(30px,6vh,58px);font-weight:800;line-height:1;min-height:clamp(32px,6vh,58px);margin:0}
.beats{display:grid;grid-template-columns:repeat(2,1fr);gap:clamp(7px,1.3vh,12px);margin:0}
.beat{background:#252525;border:3px solid #333;border-radius:clamp(12px,1.8vh,18px);padding:clamp(7px,1.4vh,13px) 8px;min-height:0;height:clamp(105px,17vh,155px);display:flex;flex-direction:column;justify-content:center;transition:.08s}
.beat.active{transform:scale(1.02);border-color:#fff;background:#3a3a3a}
.num{font-size:clamp(34px,5.5vh,52px);font-weight:800;line-height:1}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(4px,0.8vw,8px);margin-top:clamp(8px,1.4vh,13px);padding:0 clamp(3px,0.7vw,7px)}
.slot{font-size:clamp(20px,3.6vh,32px);font-weight:800;line-height:1;height:clamp(26px,4vh,38px);display:flex;align-items:center;justify-content:center;border:0;border-radius:0}
.slot.strong{color:#ff6b6b}
.slot.weak{color:#66c7ff}
.controls{white-space:nowrap}
button{font-size:clamp(14px,2.4vh,19px);padding:clamp(8px,1.5vh,13px) clamp(12px,2.5vw,22px);border:0;border-radius:12px;margin:2px;cursor:pointer}
.primary{background:#fff;color:#111;font-weight:800}
.secondary{background:#333;color:#fff}
.status{color:#777;font-size:clamp(9px,1.6vh,12px);margin:0}
@media(max-width:520px){
  body{padding:8px}
  .wrap{width:98vw;height:calc(100vh - 16px)}
  .panel{padding-left:10px;padding-right:10px}
}
@media(max-height:700px){
  h1{font-size:clamp(23px,5vh,34px)}
  .sub{font-size:clamp(11px,2.2vh,16px)}
  .panel{padding-top:6px;padding-bottom:6px}
  .beat{height:clamp(88px,15vh,115px)}
  .num{font-size:clamp(30px,5vh,42px)}
  .slot{height:24px;font-size:22px}
}
</style>
</head>
<body>
<div class="wrap">

<h1>🥁 드럼 강약 연습기</h1>
<div class="sub">1 · 2 · 3 · 4 박자에 맞춰 강 / 약을 반복합니다.</div>

<div class="panel">
  <div class="bpm-title">BPM</div>
  <div class="bpm">
    <input id="bpmRange" type="range" min="40" max="220" value="80">
    <input id="bpmNumber" type="number" min="40" max="220" value="80">
    <div class="mode">
      <label><input type="radio" name="mode" value="fixed" checked> 같은 패턴 반복</label>
      <label><input type="radio" name="mode" value="random"> 매 마디 랜덤</label>
    </div>
  </div>
</div>

<div id="current">READY</div>

<!-- JS가 실행되지 않는 미리보기에서도 4개의 박스와 4칸이 보이도록 HTML에 직접 배치 -->
<div id="beats" class="beats">
  <div class="beat" id="beat0">
    <div class="num">1</div>
    <div class="slots">
      <div class="slot strong">&lt;</div><div class="slot weak">_</div>
      <div class="slot weak">_</div><div class="slot weak">_</div>
    </div>
  </div>
  <div class="beat" id="beat1">
    <div class="num">2</div>
    <div class="slots">
      <div class="slot strong">&lt;</div><div class="slot weak">_</div>
      <div class="slot weak">_</div><div class="slot weak">_</div>
    </div>
  </div>
  <div class="beat" id="beat2">
    <div class="num">3</div>
    <div class="slots">
      <div class="slot strong">&lt;</div><div class="slot weak">_</div>
      <div class="slot weak">_</div><div class="slot weak">_</div>
    </div>
  </div>
  <div class="beat" id="beat3">
    <div class="num">4</div>
    <div class="slots">
      <div class="slot strong">&lt;</div><div class="slot weak">_</div>
      <div class="slot weak">_</div><div class="slot weak">_</div>
    </div>
  </div>
</div>

<div class="controls">
<button id="startBtn" class="primary">▶ 시작</button>
<button id="stopBtn" class="secondary">■ 정지</button>
<button id="newBtn" class="secondary">↻ 새 패턴</button>
</div>

<div class="status">&lt; = 강 · _ = 약</div>

</div>

<script>
const bpmRange=document.getElementById('bpmRange');
const bpmNumber=document.getElementById('bpmNumber');
const currentEl=document.getElementById('current');

let pattern=[];
let stepIndex=0;
let timer=null;
let audioCtx=null;

function makePattern(){
  pattern=Array.from({length:4},()=>Array.from({length:4},(_,sub)=>{
    if(sub===0)return 'strong';
    return Math.random()<0.35?'strong':'weak';
  }));
  render();
}

function render(){
  pattern.forEach((beat,beatNo)=>{
    const box=document.getElementById('beat'+beatNo);
    const slots=box.querySelectorAll('.slot');
    beat.forEach((type,i)=>{
      slots[i].className='slot '+type;
      slots[i].textContent=type==='strong'?'<':'_';
    });
  });
}

async function ensureAudio(){
  if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended') await audioCtx.resume();
}

async function clickSound(type){
  await ensureAudio();
  const osc=audioCtx.createOscillator();
  const gain=audioCtx.createGain();
  osc.type='square';
  osc.frequency.value=type==='strong'?1200:650;
  gain.gain.setValueAtTime(type==='strong'?0.75:0.24,audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.055);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(); osc.stop(audioCtx.currentTime+0.065);
}

async function playStep(){
  document.querySelectorAll('.beat').forEach(x=>x.classList.remove('active'));
  const beatNo=Math.floor(stepIndex/4);
  const subNo=stepIndex%4;
  const type=pattern[beatNo][subNo];
  document.getElementById('beat'+beatNo).classList.add('active');
  currentEl.textContent=(beatNo+1)+' · '+(subNo+1);
  await clickSound(type);
  stepIndex++;
  if(stepIndex>=16){
    stepIndex=0;
    if(document.querySelector('input[name="mode"]:checked').value==='random') makePattern();
  }
}

async function start(){
  stop(false);
  await ensureAudio();
  stepIndex=0;
  await playStep();
  timer=setInterval(playStep,(60000/Number(bpmNumber.value))/4);
}

function stop(reset=true){
  if(timer){clearInterval(timer);timer=null;}
  if(reset){
    document.querySelectorAll('.beat').forEach(x=>x.classList.remove('active'));
    currentEl.textContent='READY';
  }
}

function syncBpm(v){
  v=Math.max(40,Math.min(220,Number(v)||80));
  bpmRange.value=v; bpmNumber.value=v;
  if(timer) start();
}

bpmRange.addEventListener('input',e=>syncBpm(e.target.value));
bpmNumber.addEventListener('change',e=>syncBpm(e.target.value));
document.getElementById('startBtn').addEventListener('click',start);
document.getElementById('stopBtn').addEventListener('click',()=>stop(true));
document.getElementById('newBtn').addEventListener('click',()=>{stop(true);makePattern();});
makePattern();
</script>
</body>
</html>
